name: Unzip project archive

on:
  push:
    branches: [main]
    paths:
      - site.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract archive into repo root
        run: |
          unzip -o site.zip -d .
          rm -f site.zip
          rm -f .github/workflows/unzip.yml
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Import LAB 2AC course site"
            git push
          fi




























