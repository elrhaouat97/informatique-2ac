name: Unzip project archive
on:
  push:
    branches: [main]
    paths: [site.zip]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archive into repo root
        run: |
          unzip -o site.zip -d .
          rm site.zip
          rm -f .github/workflows/unzip.yml
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import LAB 2AC course site" || echo "nothing to commit"
          git push
